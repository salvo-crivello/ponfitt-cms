name: Deploy Production

# develop → (PR + CI) → prod → build & deploy to Vercel → archive copy on main.
# `main` is an archive only: never commit to it, the last job mirrors `prod`.

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn lint
      - run: yarn tsc --noEmit
      - run: yarn test run
      - run: yarn build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [validate]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Pull Vercel project settings and env
        run: yarn dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: yarn dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt output
        run: yarn dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  archive-main:
    name: Archive prod on main
    runs-on: ubuntu-latest
    needs: [deploy]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Plain push: rejected unless main is an ancestor of prod, so a stray
      # commit on main fails loudly instead of being overwritten.
      - name: Fast-forward main to the deployed commit
        run: git push origin "${GITHUB_SHA}:refs/heads/main"
